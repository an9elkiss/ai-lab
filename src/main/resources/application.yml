server:
  port: 9000
  servlet:
    context-path: /

spring:
  application:
    name: ai-lab
  ai:
    mcp:
      server:
        name: weis-mcp-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
        streamable-http:
          mcp-endpoint: /mcp

  # JSON序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  packages-to-scan: com.weis.demo.controller
  paths-to-match: /**

# 日志配置
logging:
  level:
    root: INFO
    com.weis: DEBUG
    dev.langchain4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# DeepSeek Configuration (using OpenAI compatible API)
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      temperature: 0.0
      timeout: PT60S
      log-requests: false
      log-responses: false
      # Explicitly specify HTTP client type to avoid conflicts
      http-client-builder: dev.langchain4j.http.client.spring.restclient.SpringRestClientBuilder

  # 阿里千问大模型配置
  dashscope:
    chat-model:
      api-key: ${QWEN_API_KEY}
      model-name: qwen-vl-max
      temperature: 0.0











